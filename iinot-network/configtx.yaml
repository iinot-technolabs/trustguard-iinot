---
# Generated by TrustGuard IIoT generateConfigs.js
# Network: AP Factory Safety Network  |  Channel: iinot-safety-channel

Organizations:

    - &IINoTIndustry
        Name: IINoTIndustryMSP
        ID:   IINoTIndustryMSP
        MSPDir: organizations/peerOrganizations/iinot-industry.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('IINoTIndustryMSP.admin', 'IINoTIndustryMSP.peer', 'IINoTIndustryMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('IINoTIndustryMSP.admin', 'IINoTIndustryMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('IINoTIndustryMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('IINoTIndustryMSP.peer')"
        AnchorPeers:
            - Host: peer0.iinot-industry.com
              Port: 7051

    - &IINoTRegulator
        Name: IINoTRegulatorMSP
        ID:   IINoTRegulatorMSP
        MSPDir: organizations/peerOrganizations/iinot-regulator.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('IINoTRegulatorMSP.admin', 'IINoTRegulatorMSP.peer', 'IINoTRegulatorMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('IINoTRegulatorMSP.admin', 'IINoTRegulatorMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('IINoTRegulatorMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('IINoTRegulatorMSP.peer')"
        AnchorPeers:
            - Host: peer0.iinot-regulator.com
              Port: 9051

    - &IINoTOrdererOrg
        Name: IINoTOrdererMSP
        ID:   IINoTOrdererMSP
        MSPDir: organizations/ordererOrganizations/iinot-safety.com/msp
        Policies:
            Readers:
                Type: Signature
                Rule: "OR('IINoTOrdererMSP.member')"
            Writers:
                Type: Signature
                Rule: "OR('IINoTOrdererMSP.member')"
            Admins:
                Type: Signature
                Rule: "OR('IINoTOrdererMSP.admin')"

Capabilities:
    Channel: &ChannelCapabilities
        V2_0: true
    Orderer: &OrdererCapabilities
        V2_0: true
    Application: &ApplicationCapabilities
        V2_5: true

Application: &ApplicationDefaults
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        LifecycleEndorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
        Endorsement:
            Type: ImplicitMeta
            Rule: "MAJORITY Endorsement"
    Capabilities:
        <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
    OrdererType: etcdraft
    Addresses:
    - orderer.iinot-safety.com:7050
    EtcdRaft:
        Consenters:

            - Host: orderer.iinot-safety.com
              Port: 7050
              ClientTLSCert: organizations/ordererOrganizations/iinot-safety.com/orderers/orderer.iinot-safety.com/tls/server.crt
              ServerTLSCert: organizations/ordererOrganizations/iinot-safety.com/orderers/orderer.iinot-safety.com/tls/server.crt
        Options:
            TickInterval:         500ms
            ElectionTick:         10
            HeartbeatTick:        1
            MaxInflightBlocks:    5
            SnapshotIntervalSize: 16 MB
    BatchTimeout: 2s
    BatchSize:
        MaxMessageCount:   10
        AbsoluteMaxBytes:  99 MB
        PreferredMaxBytes: 512 KB
    Organizations:
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
        BlockValidation:
            Type: ImplicitMeta
            Rule: "ANY Writers"
    Capabilities:
        <<: *OrdererCapabilities

Channel: &ChannelDefaults
    Policies:
        Readers:
            Type: ImplicitMeta
            Rule: "ANY Readers"
        Writers:
            Type: ImplicitMeta
            Rule: "ANY Writers"
        Admins:
            Type: ImplicitMeta
            Rule: "MAJORITY Admins"
    Capabilities:
        <<: *ChannelCapabilities

Profiles:
    IINoTSafetyGenesis:
        <<: *ChannelDefaults
        Orderer:
            <<: *OrdererDefaults
            Organizations:
                - *IINoTOrdererOrg
            Capabilities:
                <<: *OrdererCapabilities
        Application:
            <<: *ApplicationDefaults
            Organizations:
                - *IINoTIndustry
                - *IINoTRegulator
            Capabilities:
                <<: *ApplicationCapabilities
